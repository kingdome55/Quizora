<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="panel.css" />
  <title>题灵 · Quizora</title>
</head>
<body>
  <header>
    <div class="brand">题灵 <span>Quizora</span></div>
    <div class="pill idle" id="statusPill">待机</div>
  </header>

  <main>
    <section class="card">
      <h2>模型连接</h2>
      <label class="field">
        <span>API Base URL</span>
        <input id="baseUrl" type="text" spellcheck="false" placeholder="https://api.deepseek.com/v1" />
      </label>
      <label class="field">
        <span>API Key</span>
        <input id="apiKey" type="password" spellcheck="false" placeholder="sk-..." />
      </label>
      <div class="row">
        <button id="toggleKey" class="ghost" type="button">显示 Key</button>
        <button id="clearKey" class="ghost" type="button">清空 Key</button>
      </div>
      <label class="field">
        <span>模型</span>
        <select id="model">
          <option value="deepseek-flash">DeepSeek V4.1 Flash（deepseek-flash）</option>
          <option value="deepseek-v4-pro">DeepSeek V4 Pro（deepseek-v4-pro）</option>
          <option value="deepseek-chat">deepseek-chat（旧名）</option>
          <option value="__custom__">自定义模型…</option>
        </select>
        <small class="hint">切换模型会自动更新并保存对应 Base URL</small>
      </label>
      <label class="field" id="customModelWrap" hidden>
        <span>自定义模型名</span>
        <input id="modelCustom" type="text" spellcheck="false" placeholder="model-id" />
      </label>
      <div class="row">
        <button id="saveBtn" class="ghost" type="button">保存</button>
        <button id="testBtn" class="ghost" type="button">测试连接</button>
        <button id="testVisionBtn" class="ghost" type="button">测试图形</button>
      </div>
    </section>

    <section class="card">
      <h2>运行</h2>
      <label class="slider">
        <span>答题间隔 <output id="delayOut">1.5s</output></span>
        <input id="delay" type="range" min="0.3" max="3" step="0.1" value="1.5" />
      </label>
      <label class="check">
        <input id="dryRun" type="checkbox" checked />
        <span>演练模式（只给建议，不写入答案）</span>
      </label>
      <label class="check">
        <input id="examSkip" type="checkbox" checked />
        <span>学习通：跳过已作答题目</span>
      </label>
      <label class="check">
        <input id="examScroll" type="checkbox" checked />
        <span>学习通：启动时滚动加载</span>
      </label>
      <div class="row">
        <button id="startBtn" class="primary" type="button">开始</button>
        <button id="stopBtn" class="danger" type="button">停止</button>
      </div>
      <div class="row">
        <button id="probeBtn" class="ghost" type="button">探测当前页</button>
        <button id="clearBtn" class="ghost" type="button">清空缓存</button>
      </div>
    </section>

    <section class="card">
      <h2>状态</h2>
      <div class="stat"><span>站点</span><b id="siteName">—</b></div>
      <div class="stat"><span>题号</span><b id="qno">—</b></div>
      <div class="stat"><span>缓存</span><b id="cacheCount">0</b></div>
      <pre id="probe" class="probe" hidden></pre>
    </section>

    <section class="card logs">
      <h2>日志</h2>
      <ul id="logs"></ul>
    </section>
  </main>

  <footer>快捷键 Alt+Shift+S 停止 · 刷新页面后需重新开始</footer>
  <script src="panel-model.js"></script>
  <script src="panel.js"></script>
  <script src="panel-test.js"></script>
</body>
</html>
